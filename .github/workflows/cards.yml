name: Profile cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  cards:
    name: Stats, languages, pins, activity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=ahmedalfarjani&show_icons=true&hide_rank=true&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF&text_color=C9D1D9"
          path: profile/stats-dark.svg
          core_version: "2.3.1"
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=ahmedalfarjani&show_icons=true&hide_rank=true&hide_border=true&bg_color=FFFFFF&title_color=0969DA&icon_color=0969DA&text_color=24292F"
          path: profile/stats-light.svg
          core_version: "2.3.1"
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=ahmedalfarjani&layout=compact&langs_count=6&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9"
          path: profile/top-langs-dark.svg
          core_version: "2.3.1"
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=ahmedalfarjani&layout=compact&langs_count=6&hide_border=true&bg_color=FFFFFF&title_color=0969DA&text_color=24292F"
          path: profile/top-langs-light.svg
          core_version: "2.3.1"
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Repository pin — CO2 forecasting (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=ahmedalfarjani&repo=Deep-Learning-for-time-series-forecasting-on-Carbon-Dioxide&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF&text_color=C9D1D9"
          path: profile/pin-deep-learning-dark.svg
          core_version: "2.3.1"
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Repository pin — CO2 forecasting (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=ahmedalfarjani&repo=Deep-Learning-for-time-series-forecasting-on-Carbon-Dioxide&hide_border=true&bg_color=FFFFFF&title_color=0969DA&icon_color=0969DA&text_color=24292F"
          path: profile/pin-deep-learning-light.svg
          core_version: "2.3.1"
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Repository pin — InvenTree (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=ahmedalfarjani&repo=InvenTree&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF&text_color=C9D1D9"
          path: profile/pin-inventree-dark.svg
          core_version: "2.3.1"
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Repository pin — InvenTree (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=ahmedalfarjani&repo=InvenTree&hide_border=true&bg_color=FFFFFF&title_color=0969DA&icon_color=0969DA&text_color=24292F"
          path: profile/pin-inventree-light.svg
          core_version: "2.3.1"
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Activity graph (dark)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ahmedalfarjani
          options: "theme=react-dark&bg_color=0D1117&color=C9D1D9&title_color=58A6FF&line=58A6FF&point=58A6FF&area=true&area_color=1F6FEB&hide_border=true&days=31&height=250&custom_title=Contribution%20Activity"
          output_path: profile/activity-dark.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Activity graph (light)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ahmedalfarjani
          options: "theme=github-compact&bg_color=FFFFFF&color=24292F&title_color=0969DA&line=0969DA&point=0969DA&area=true&area_color=54AEFF&hide_border=true&days=31&height=250&custom_title=Contribution%20Activity"
          output_path: profile/activity-light.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git commit -m "chore: update profile cards" || exit 0
          git push || (git pull --rebase origin main && git push)
